services:
  ofertas:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    env_file:
      - path: ./data/ai.env
        required: false
    environment:
      DATABASE_PATH: /data/ofertas.sqlite3
      CHROME_PATH: /usr/bin/chromium
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp
      XDG_CACHE_HOME: /tmp
      R2_IMAGES_CREDENTIALS: ${R2_IMAGES_CREDENTIALS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://ofertas.funnie.dev/auth/google/callback
    volumes:
      - ./data:/data
      - ./data/local:/app/.local
    networks:
      - ofertas-network
networks:
  ofertas-network:
    name: ofertas-network
    external: true
