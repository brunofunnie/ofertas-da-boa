  <style>
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff9ef;pointer-events:none;animation:splash-exit .35s ease 1.65s forwards}
    .splash-logo{width:112px;height:112px;overflow:visible}
    .splash-thumb{transform-box:fill-box;transform-origin:30% 80%;animation:thumb-toss 1.3s ease both}
    .splash-plus{transform-box:view-box;transform-origin:98px 33px;animation:coin-toss 1.35s cubic-bezier(.2,.7,.2,1) both}
    .splash-title{color:#9f3321;font:700 22px/1.2 system-ui,sans-serif;letter-spacing:-.03em}
    @keyframes thumb-toss{0%,18%{transform:rotate(-5deg)}35%{transform:rotate(7deg)}55%,100%{transform:rotate(0)}}
    @keyframes coin-toss{0%,14%{transform:translate(-34px,4px) rotate(0) scale(.8)}48%{transform:translate(-17px,-29px) rotate(270deg) scale(1.1)}76%,100%{transform:translate(0,0) rotate(720deg) scale(1)}}
    @keyframes splash-exit{to{opacity:0;visibility:hidden}}
    @media(prefers-reduced-motion:reduce){#splash{animation-delay:.25s}.splash-thumb,.splash-plus{animation:none}}
  </style>
